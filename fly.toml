# fly.toml app configuration file generated for yeni-demo on 2026-06-08T11:59:33+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yeni-demo'
# DB(Neon)가 us-east-2에 있어 앱도 같은 지역(iad)에 둔다 — 쿼리 라운드트립 최소화.
primary_region = 'iad'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
