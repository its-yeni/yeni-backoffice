column.stock_count_line.difference_quantity=실사 수량 - 시스템 수량. 완료 시 이 값만큼 재고를 조정합니다.

table.pos_terminal=매장에 등록된 POS 단말의 식별 정보와 접속 상태를 관리합니다. 원문 인증키는 저장하지 않고 해시만 보관합니다.
