column.pos_terminal.terminal_name=운영자가 확인하는 POS 단말 이름입니다.
column.pos_terminal.credential_hash=POS API 인증 자격 증명의 단방향 해시입니다.
column.pos_terminal.active=현재 POS API 접속을 허용하는 단말인지 나타냅니다.
column.pos_terminal.app_version=단말이 마지막으로 보고한 WinForms 애플리케이션 버전입니다.
