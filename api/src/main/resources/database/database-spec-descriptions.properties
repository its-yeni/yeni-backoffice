table.pos_inbound_request=POS에서 서버로 전송한 요청의 멱등성, 처리 결과와 재시도 상태를 기록합니다.
column.pos_inbound_request.terminal_id=요청을 전송한 POS 단말 식별자입니다.
column.pos_inbound_request.client_request_id=POS가 생성한 요청 고유 ID이며 같은 단말에서 중복 주문·결제를 방지합니다.
column.pos_inbound_request.request_type=판매, 결제, 취소, 매출 동기화, 로그 전송 중 요청 유형입니다.
column.pos_inbound_request.request_hash=동일 요청 ID에 다른 내용이 전송되는 것을 탐지하는 SHA-256 해시입니다.
