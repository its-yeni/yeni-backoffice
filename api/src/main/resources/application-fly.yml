server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  datasource:
    # fly secrets set DATABASE_URL="jdbc:postgresql://host/db?user=..&password=..&sslmode=require"
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 널 가능한 String 파라미터를 lower()/LIKE 로 감쌀 때 PG가 타입을 bytea 로 추론하는 것을 막는다.
      data-source-properties:
        stringtype: unspecified

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

logging:
  level:
    root: info
