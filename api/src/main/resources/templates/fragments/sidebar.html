<aside class="sidebar" id="sidebar" xmlns:th="http://www.thymeleaf.org">
  <div class="logo">
    <div>
      <div class="logo-text">Yeni<span>Backoffice</span></div>
      <div class="logo-sub">커머스 운영 백오피스</div>
    </div>
    <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="사이드바 접기">‹</button>
  </div>

  <nav class="nav">
    <div class="nav-group" th:each="group : ${sidebarNavigationGroups}"
         th:data-group-code="${group.groupCode}"
         th:data-has-active="${#lists.contains(group.items.![active], true)}">
      <button type="button" class="nav-group-toggle" aria-expanded="true">
        <span class="nav-title" th:text="${group.groupName}">메뉴</span>
        <span class="nav-arrow">⌄</span>
      </button>
      <div class="nav-group-items">
        <div class="nav-item-wrap" th:each="item : ${group.items}"
             th:classappend="${item.sectionActive} ? ' is-section-active'">
        <a th:href="@{${item.itemUrl}}" th:title="${item.itemName}" th:classappend="${item.active} ? ' active'">
          <span class="nav-item-icon" aria-hidden="true" th:switch="${item.icon}">
            <svg th:case="'dashboard'" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
            <svg th:case="'exception'" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
            <svg th:case="'settle'" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            <svg th:case="'ledger'" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"></rect><path d="M4 9h16M9 4v16"></path></svg>
            <svg th:case="'box'" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><path d="M3.3 7 12 12l8.7-5M12 22V12"></path></svg>
            <svg th:case="'tag'" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"></path><circle cx="7" cy="7" r="1.4"></circle></svg>
            <svg th:case="'cart'" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"></path></svg>
            <svg th:case="'chart'" viewBox="0 0 24 24"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"></path></svg>
            <svg th:case="'audit'" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 15l2 2 4-4"></path></svg>
            <svg th:case="'grid'" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
            <svg th:case="'store'" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M3 9h18M9 20v-6h6v6"></path></svg>
            <svg th:case="'supplier'" viewBox="0 0 24 24"><path d="M10 17h4V5H2v12h3M15 17h5v-5l-3-3h-2M6 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg>
            <svg th:case="*" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg>
          </span>
          <span class="nav-item-label" th:text="${item.itemName}">메뉴</span>
        </a>
        <div class="nav-substeps" th:if="${not #lists.isEmpty(item.children)}">
          <a th:each="child : ${item.children}" th:href="@{${child.itemUrl}}"
             th:text="${child.itemName}" th:classappend="${child.active} ? ' active'">단계</a>
        </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="sidebar-footer">
    <a href="/" class="sidebar-link-button">포트폴리오</a>
    <a href="/admin/database-spec">DB 명세</a>
    <a href="/swagger-ui/index.html">API 문서</a>
  </div>
</aside>
<script>(function(){
  var aliases={"/admin/sales-ledger":"/admin/payment-operations/sales-ledger","/admin/settlements":"/admin/payment-operations/settlements","/admin/commerce/product-options":"/admin/commerce/options"};
  var path=aliases[location.pathname]||location.pathname;
  var links=[].slice.call(document.querySelectorAll('.nav a'));
  links.forEach(function(l){l.classList.remove('active');});
  // 가장 구체적으로(경로가 가장 길게) 일치하는 링크 하나만 active — 부모/자식 동시 활성 방지.
  var best=null,bestLen=-1;
  links.forEach(function(l){var href=l.getAttribute('href');if(!href)return;
    if((path===href||path.indexOf(href+'/')===0)&&href.length>bestLen){best=l;bestLen=href.length;}});
  if(best){
    best.classList.add('active');
    var wrap=best.closest('.nav-item-wrap');if(wrap)wrap.classList.add('is-section-active');
    var group=best.closest('.nav-group');if(group)group.dataset.hasActive='true';
  }
}());</script>
<script>(function(){document.body.classList.toggle('sidebar-collapsed',localStorage.getItem('sidebar-collapsed')==='true');}());</script>
