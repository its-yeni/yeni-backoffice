<header class="topbar" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" href="/css/demo-guide.css">
    <div class="topbar-context">
        <button class="mobile-menu-btn" type="button" onclick="toggleSidebar()">메뉴</button>
    </div>
    <div class="top-actions">
        <button class="design-note-trigger" id="designNoteTrigger" type="button" aria-controls="designNoteDrawer" aria-expanded="false">설계 노트</button>
        <div class="profile-pill"><div class="avatar">Y</div>권예은</div>
    </div>
    <div class="design-note-dim" id="designNoteDim" hidden></div>
    <aside class="design-note-drawer" id="designNoteDrawer" aria-hidden="true" aria-labelledby="designNoteTitle">
        <header><div><span>설계 메모</span><h2 id="designNoteTitle">이 화면의 설계 메모</h2></div><button type="button" id="designNoteClose" aria-label="닫기">×</button></header>
        <div class="design-note-body" id="designNoteBody"></div>
    </aside>
    <nav class="workspace-tabs" id="workspaceTabs" aria-label="열린 작업 화면"></nav>
</header>
<script src="/js/demo-guide.js"></script>
