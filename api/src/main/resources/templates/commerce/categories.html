<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>카테고리 관리 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css"><link rel="stylesheet" href="/css/pages/commerce-categories.css"><link rel="stylesheet" href="/css/pages/commerce-list-system.css"><link rel="stylesheet" href="/css/pages/commerce-system.css">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="content commerce-page category-page cmc-page">
  <header class="page-header"><div><h3>카테고리 관리</h3><p>상품 분류와 고객 화면의 노출 순서를 관리합니다.</p></div><form id="category-create-form" class="category-create"><input id="new-category-name" placeholder="새 카테고리명" maxlength="100" required><button class="btn btn-primary">카테고리 추가</button></form></header>
  <div class="cmc-toolbar">
    <label class="cmc-search"><input id="category-keyword" type="search" placeholder="카테고리명 검색"></label>
    <select id="category-exposure-filter"><option value="">노출 상태 전체</option><option value="true">노출</option><option value="false">숨김</option></select>
    <div class="cmc-toolbar-actions"><button class="btn btn-text" id="category-filter-reset" type="button">초기화</button><button class="btn btn-primary" id="category-search-btn" type="button">조회</button></div>
  </div>
  <div class="cmc-kpis">
    <div class="cmc-kpi"><span class="cmc-kpi-ico">🗂</span><div><span>전체 카테고리</span><strong id="kpi-cat-total">0<em>개</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico is-ok">👁</span><div><span>노출 중</span><strong id="kpi-cat-exposed">0<em>개</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico">📦</span><div><span>연결 상품 수</span><strong id="kpi-cat-linked">0<em>개</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico is-muted">⚠</span><div><span>미연결 카테고리</span><strong id="kpi-cat-empty">0<em>개</em></strong></div></div>
  </div>
  <div class="cmc-list"><div class="data-table-wrap"><table class="data-table category-data-table"><thead><tr><th class="drag-column" aria-label="순서 변경"></th><th>카테고리명</th><th class="number">연결 상품 수</th><th>고객 노출</th><th class="number">정렬 순서</th><th>최근 수정</th><th class="actions">관리</th></tr></thead><tbody id="category-rows"></tbody></table><div class="data-table-empty" id="category-empty" hidden><strong>조건에 맞는 카테고리가 없습니다.</strong><p>검색 조건을 변경하거나 새 카테고리를 추가해 주세요.</p></div></div></div>
  <div class="cmc-list-footer"><span class="cmc-total">총 <b id="category-total">0</b>개</span><div id="category-pagination"></div></div>
  <p id="category-message" class="category-message" role="status"></p><span hidden>수정 버튼</span>
</section></main></div><script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/commerce-categories.js"></script></body></html>
