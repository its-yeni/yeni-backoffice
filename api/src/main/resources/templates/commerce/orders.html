<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주문 관리 - Yeni Backoffice</title>
  <link rel="stylesheet" th:href="@{/css/common.css}"><link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/commerce-admin.css}"><link rel="stylesheet" th:href="@{/css/pages/payment-operations.css}">
  <link rel="stylesheet" th:href="@{/css/pages/commerce-list-system.css}"><link rel="stylesheet" th:href="@{/css/pages/commerce-orders.css}">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main">
  <div th:replace="~{fragments/topbar :: header}"></div>
  <section class="content commerce-page">
    <header class="page-header"><div><h3>주문 관리</h3><p>고객 주문부터 결제 처리 상태까지 한 화면에서 확인합니다.</p></div><div class="page-header-actions"><a class="btn btn-light" href="/admin/payment-operations">PG 거래</a><a class="btn btn-primary" href="/admin/commerce/preview">고객 주문 테스트</a></div></header>

    <nav class="page-tabs">
      <button type="button" class="active" data-tab="list">주문 목록</button>
      <button type="button" data-tab="mock">Mock 주문 생성</button>
    </nav>

    <div class="page-tab-panel active" id="tab-list">
      <div class="filter-bar order-filter-row">
        <label>주문일 <input type="date" id="filterDateFrom"> ~ <input type="date" id="filterDateTo"></label>
        <label>결제상태 <select id="filterPaymentStatus"><option value="">전체</option><option value="READY">결제 대기</option><option value="APPROVED">결제 승인</option><option value="APPROVE_UNKNOWN">결과 불명</option><option value="FAILED">결제 실패</option><option value="CANCELLED">취소</option></select></label>
        <input id="orderKeyword" type="search" placeholder="주문번호, 구매자명 검색">
        <button class="btn btn-primary order-search-button" id="orderSearchBtn" type="button">검색</button>
        <button class="btn btn-text" id="orderRefreshBtn">초기화</button>
      </div>
      <div class="quick-filters" id="quickFilters"></div>
      <div class="data-table-wrap order-table-wrap">
        <table class="data-table order-list-table">
          <thead><tr>
            <th class="row-index">#</th>
            <th data-sort="orderNo">주문번호</th>
            <th data-sort="createdAt">주문일시</th>
            <th data-sort="buyerName">구매자</th>
            <th data-sort="storeId">매장</th>
            <th>상품</th>
            <th class="amount" data-sort="payableAmount">결제금액</th>
            <th data-sort="paymentStatus">결제상태</th>
            <th data-sort="orderStatus">주문 상태</th>
            <th class="actions">관리</th>
          </tr></thead>
          <tbody id="orderRows"></tbody>
        </table>
        <div class="data-table-empty" id="orderEmpty" hidden><strong>생성된 주문이 없습니다.</strong><p>고객 주문 테스트 또는 Mock 주문 생성으로 주문을 만들어 보세요.</p></div>
        <div id="orderPagination"></div>
      </div>
    </div>

    <div class="page-tab-panel" id="tab-mock">
      <div class="mock-generate-grid">
        <div class="mock-generate-main">
          <section class="card ops-panel">
            <div class="panel-header"><h3>기본 정보</h3></div>
            <div class="form-grid three-column">
              <label>구매자명<input id="buyerNameInput" value="포트폴리오 고객"></label>
              <label>연락처<input id="buyerPhoneInput" value="010-0000-0000"></label>
              <label>매출처<input id="storeInput" placeholder="선택 입력" disabled></label>
            </div>
          </section>
          <section class="card ops-panel">
            <div class="panel-header order-item-header"><h3>상품 정보</h3><button class="btn btn-light" id="addOrderItemBtn">+ 상품 추가</button></div>
            <div class="responsive-table"><table class="order-item-table"><thead><tr><th>분류</th><th>상품</th><th>옵션</th><th>단가</th><th>수량</th><th>금액</th><th></th></tr></thead><tbody id="orderItemBody"></tbody></table></div>
            <div class="mock-order-total"><span>총 주문금액</span><strong id="payableAmountPreview">0원</strong></div>
          </section>
        </div>
        <aside class="mock-scenario-panel">
          <div class="panel-header"><h3>시나리오 선택</h3></div>
          <div class="scenario-list" id="scenarioList"></div>
          <div class="button-row mock-generate-actions">
            <button class="btn btn-light" id="mockResetBtn">초기화</button>
            <button class="btn btn-primary" id="mockCreateBtn">Mock 주문 생성</button>
          </div>
          <p class="preview-message" id="mockMessage"></p>
        </aside>
      </div>
    </div>

  </section>
</main></div>

<div class="commerce-modal" id="order-detail-modal" aria-hidden="true">
  <div class="commerce-modal-dim" data-close-detail></div>
  <section class="commerce-modal-card order-detail-card" role="dialog" aria-modal="true">
    <div class="modal-title-row">
      <div class="detail-breadcrumb"><a href="#" data-close-detail>주문 관리</a><span>&gt;</span><span>주문 상세</span></div>
      <button class="icon-close" type="button" data-close-detail>×</button>
    </div>
    <div id="order-detail-body"></div>
  </section>
</div>

<script th:src="@{/js/admin-pagination.js}"></script><script th:src="@{/js/common.js}"></script><script th:src="@{/js/pages/commerce-orders.js}"></script>
</body></html>
