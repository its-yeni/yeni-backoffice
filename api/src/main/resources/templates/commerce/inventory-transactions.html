<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>입출고 이력 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css"><link rel="stylesheet" href="/css/pages/commerce-list-system.css"><link rel="stylesheet" href="/css/pages/inventory-operations.css"><link rel="stylesheet" href="/css/pages/commerce-system.css">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="content product-page commerce-page inventory-audit-page">
  <header class="page-header"><div><h3>재고 이동 이력</h3><p>입고부터 주문 예약, 출고, 취소 복원, 수동 조정까지 SKU 수량 변경 근거를 추적합니다.</p></div><div class="page-header-actions"><a class="btn btn-light" href="/admin/commerce/inventory">재고 현황</a></div></header>
  <div class="cmc-kpis" aria-label="조회 결과 요약">
    <div class="cmc-kpi"><div><span>조회 이력</span><strong id="tx-total">0건</strong></div></div>
    <div class="cmc-kpi"><div><span>실재고 증감</span><strong id="tx-stock-delta">0개</strong></div></div>
    <div class="cmc-kpi"><div><span>예약 증감</span><strong id="tx-reserved-delta">0개</strong></div></div>
    <div class="cmc-kpi"><div><span>자동 처리</span><strong id="tx-system-count">0건</strong></div></div>
  </div>
  <div class="cmc-toolbar inventory-audit-filter"><label class="cmc-search"><input id="tx-keyword" type="search" placeholder="상품명, 상품코드, SKU, 참조번호 검색"></label><select id="type-filter"><option value="">전체 유형</option><option value="RECEIPT">입고</option><option value="RESERVE">주문 예약</option><option value="RELEASE">예약 해제</option><option value="SHIPMENT">출고 완료</option><option value="ADJUST_IN">재고 증가 조정</option><option value="ADJUST_OUT">재고 감소 조정</option><option value="TRANSFER_IN">이동 입고</option><option value="TRANSFER_OUT">이동 출고</option></select><select id="ref-filter"><option value="">전체 출처</option><option value="PURCHASE_ORDER">발주</option><option value="STOCK_COUNT">재고 실사</option><option value="ORDER">주문</option><option value="RETURN">반품</option><option value="TRANSFER">재고 이동</option><option value="MANUAL">수동</option></select><select id="actor-filter"><option value="">전체 처리 주체</option><option value="SYSTEM">시스템 자동</option><option value="ADMIN">관리자</option></select><div class="cmc-toolbar-actions"><button class="btn btn-text" id="tx-filter-reset" type="button">초기화</button></div></div>
  <div class="data-table-wrap inventory-audit-table"><table class="data-table inventory-audit-data-table"><thead><tr><th class="row-index">#</th><th data-sort="createdAt">발생일시</th><th data-sort="productName">상품 / SKU</th><th data-sort="type">유형</th><th class="number">증감</th><th class="number">실재고</th><th class="number">예약재고</th><th>참조</th><th data-sort="actor">처리 주체</th><th>사유</th></tr></thead><tbody id="tx-rows"></tbody></table><div class="data-table-empty" id="empty-tx" hidden><strong>조건에 맞는 재고 이동 이력이 없습니다.</strong><p>필터를 초기화하거나 입고·주문 처리 후 다시 확인해 주세요.</p></div><div id="tx-pagination"></div></div>
</section></main></div><script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/commerce-status-catalog.js"></script><script src="/js/pages/inventory-transactions.js"></script></body></html>
