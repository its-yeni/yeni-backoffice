<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>출고 관리 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css"><link rel="stylesheet" href="/css/pages/commerce-list-system.css"><link rel="stylesheet" href="/css/pages/inventory-operations.css"><link rel="stylesheet" href="/css/pages/commerce-system.css">
</head>
<body>
<div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="product-page commerce-page">
  <header class="page-header"><div><h3>출고 관리</h3><p>결제가 완료돼 예약된 SKU 중 아직 출고되지 않은 주문 상품입니다. 출고 완료 처리하면 현재재고·예약재고가 함께 정리됩니다.</p></div><div class="page-header-actions"><a class="btn btn-light" href="/admin/commerce/inventory">재고 현황</a></div></header>
  <div class="cmc-kpis">
    <div class="cmc-kpi"><span class="cmc-kpi-ico">🚚</span><div><span>출고 대기</span><strong id="kpi-sh-items">0<em>건</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico">🧾</span><div><span>출고 대기 주문</span><strong id="kpi-sh-orders">0<em>건</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico is-muted">📦</span><div><span>출고 예정 수량</span><strong id="kpi-sh-qty">0<em>개</em></strong></div></div>
  </div>
  <div class="cmc-toolbar">
    <label class="cmc-search"><input id="shipment-keyword" type="search" placeholder="주문번호 · 구매자 · SKU 검색"></label>
    <div class="cmc-toolbar-actions"><button class="btn btn-text" id="shipment-filter-reset" type="button">초기화</button></div>
  </div>
  <div class="data-table-wrap"><table class="data-table shipment-table"><thead><tr><th data-sort="orderNo">주문번호</th><th data-sort="buyerName">구매자</th><th data-sort="productName">상품</th><th data-sort="sku">SKU</th><th>옵션</th><th class="number" data-sort="quantity">수량</th><th class="amount" data-sort="itemAmount">금액</th><th class="actions">관리</th></tr></thead><tbody id="shipment-rows"></tbody></table><div class="data-table-empty" id="empty-shipment" hidden><strong>출고 대기 중인 주문이 없습니다.</strong><p>결제가 완료되면 여기에 출고 대상으로 표시됩니다.</p></div><div id="shipment-pagination"></div></div>
</section></main></div>
<script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/shipments.js"></script>
</body></html>
