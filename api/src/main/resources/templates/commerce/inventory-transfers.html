<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>재고 이동 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css"><link rel="stylesheet" href="/css/pages/commerce-list-system.css"><link rel="stylesheet" href="/css/pages/inventory-operations.css"><link rel="stylesheet" href="/css/pages/commerce-system.css">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="content product-page commerce-page inventory-transfer-page">
  <header class="page-header"><div><h3>재고 이동</h3><p>출발 위치에서 차감된 재고를 이동 중으로 관리하고, 도착 확인 시 입고합니다.</p></div><div class="page-header-actions"><a class="btn btn-light" href="/admin/commerce/inventory">재고 현황</a><button class="btn btn-primary" id="transfer-new" type="button">이동 전표 생성</button></div></header>

  <div class="cmc-kpis">
    <div class="cmc-kpi"><span class="cmc-kpi-ico">📝</span><div><span>이동 요청</span><strong id="requested-count">0<em>건</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico">🔄</span><div><span>이동 중</span><strong id="transit-count">0<em>건</em></strong></div></div>
    <div class="cmc-kpi"><span class="cmc-kpi-ico is-ok">✅</span><div><span>입고 완료</span><strong id="received-count">0<em>건</em></strong></div></div>
  </div>

  <div class="cmc-toolbar">
    <label class="cmc-search"><input id="transfer-keyword" type="search" placeholder="이동번호, 출발 위치, 도착 위치 검색"></label>
    <select id="transfer-status-filter"><option value="">상태 전체</option><option value="REQUESTED">이동 요청</option><option value="IN_TRANSIT">이동 중</option><option value="RECEIVED">입고 완료</option><option value="CANCELLED">취소</option></select>
    <div class="cmc-toolbar-actions"><button class="btn btn-text" id="transfer-filter-reset" type="button">초기화</button></div>
  </div>

  <div class="data-table-wrap">
    <table class="data-table transfer-table"><thead><tr><th class="row-index">#</th><th data-sort="transferNo">이동번호</th><th data-sort="sourceStoreName">출발 위치</th><th data-sort="destinationStoreName">도착 위치</th><th>SKU / 수량</th><th data-sort="status">상태</th><th data-sort="createdAt">처리일시</th><th class="actions">관리</th></tr></thead><tbody id="transfer-rows"></tbody></table>
    <div class="data-table-empty" id="transfer-empty" hidden><strong>등록된 이동 전표가 없습니다.</strong><p>이동 전표를 생성하면 요청부터 입고 완료까지 추적할 수 있습니다.</p></div>
    <div id="transfer-pagination"></div>
  </div>
</section></main></div>
<dialog id="transfer-dialog"><form method="dialog" class="modal-form">
  <header><h2>이동 전표 생성</h2><button value="cancel" aria-label="닫기">×</button></header>
  <label>출발 위치 <span class="req">*</span><select id="source-store"></select></label>
  <label>도착 위치 <span class="req">*</span><select id="destination-store"></select></label>
  <label>SKU <span class="req">*</span><select id="transfer-variant"></select></label>
  <label>이동 수량 <span class="req">*</span><input id="transfer-quantity" type="number" min="1" value="1"></label>
  <label>이동 사유 <span class="req">*</span><input id="transfer-reason" placeholder="예: 강남점 안전재고 보충"></label>
  <footer><button class="btn btn-light" value="cancel">취소</button><button class="btn btn-primary" id="transfer-save" type="button">전표 생성</button></footer>
</form></dialog>
<script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/inventory-transfers.js"></script></body></html>
