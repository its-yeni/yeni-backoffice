<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>재고 운영 계획 - Yeni Backoffice</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css"><link rel="stylesheet" href="/css/pages/commerce-list-system.css"><link rel="stylesheet" href="/css/pages/inventory-planning.css"></head><body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="commerce-page inventory-planning-page" th:attr="data-mode=${planningMode}">
 <header class="page-header planning-header"><div><span class="commerce-kicker">INVENTORY CONTROL</span><h3 id="planning-title">재고 운영 계획</h3><p id="planning-description">재고 위험을 먼저 확인하고 필요한 작업으로 바로 이동합니다.</p></div><div class="page-header-actions"><a class="btn btn-light" href="/admin/commerce/receiving">입고 등록</a><a class="btn btn-light" href="/admin/commerce/inventory">통합 재고</a></div></header>
 <nav class="planning-tabs"><a data-tab="lots" href="/admin/commerce/inventory/lots">LOT·유통기한</a><a data-tab="replenishment" href="/admin/commerce/inventory/replenishment">재고 소진·발주 제안</a><a data-tab="insights" href="/admin/commerce/inventory/insights">재고 인사이트</a></nav>
 <div class="planning-kpis" id="planning-kpis"></div>
 <section class="planning-guide" id="planning-guide"></section>
 <div class="cmc-toolbar planning-toolbar"><label class="cmc-search"><input id="planning-keyword" type="search" placeholder="상품명, SKU, LOT 번호 검색"></label><select id="planning-status"><option value="">상태 전체</option></select><select id="lead-time" hidden><option value="7">리드타임 7일</option><option value="14" selected>리드타임 14일</option><option value="30">리드타임 30일</option><option value="60">리드타임 60일</option></select><div class="cmc-toolbar-actions"><button class="btn btn-text" id="planning-reset" type="button">초기화</button></div></div>
 <div class="data-table-wrap planning-table-wrap"><table class="data-table"><thead id="planning-head"></thead><tbody id="planning-rows"></tbody></table><div class="data-table-empty" id="planning-empty" hidden><strong>조건에 맞는 데이터가 없습니다.</strong><p>검색어나 상태 필터를 변경해 보세요.</p></div></div>
 <div id="planning-pagination"></div>
</section></main></div><script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/inventory-planning.js"></script></body></html>
