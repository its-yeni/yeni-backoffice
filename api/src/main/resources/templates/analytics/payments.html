<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>결제 분석 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css">
  <link rel="stylesheet" href="/css/pages/analytics.css">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="content analytics-page">
  <header class="page-header"><div><h3>결제 분석</h3><p>PG 승인·취소·실패 추이와 결제수단별 현황을 확인합니다.</p></div><div class="page-header-actions"><span th:replace="~{analytics/_parts :: meta}"></span></div></header>
  <nav th:replace="~{analytics/_parts :: tabs('payments')}"></nav>
  <div th:replace="~{analytics/_parts :: filter(true)}"></div>

  <div class="an-channel-seg" id="an-channel-seg" role="tablist" aria-label="결제 채널">
    <button type="button" class="is-on" data-channel="">전체</button>
    <button type="button" data-channel="WEB">온라인</button>
    <button type="button" data-channel="POS">매장(POS)</button>
  </div>

  <div class="an-kpis" id="an-kpis"></div>

  <div class="an-panel" style="margin-bottom:16px">
    <h4>채널 × 결제수단 (승인금액)</h4>
    <div class="tbl-scroll" style="overflow-x:auto">
      <table class="an-table" id="an-channel-matrix"><thead></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
  </div>

  <div class="an-panel" style="margin-bottom:16px">
    <div class="an-panel-head"><h4>일별 승인율 추이</h4>
      <div class="an-legend"><span><i class="bar"></i>승인금액</span><span><i class="line"></i>승인율(%)</span></div></div>
    <div class="an-chart" id="an-approval-trend"></div>
  </div>

  <div class="an-grid g-2">
    <div class="an-panel"><h4>결제수단별 승인금액</h4><div class="an-chart" id="an-method-amount"></div></div>
    <div class="an-panel"><h4>결제수단별 승인 / 취소 / 실패 건수</h4>
      <table class="an-table" id="an-method-count"><thead><tr>
        <th>결제수단</th><th class="num">요청</th><th class="num">승인</th><th class="num">취소</th><th class="num">실패</th><th class="num">승인율</th>
      </tr></thead><tbody></tbody><tfoot></tfoot></table>
    </div>
  </div>
</section></main></div>
<script src="/js/common.js"></script><script src="/js/canvas-charts.js"></script><script src="/js/pages/analytics-common.js"></script><script src="/js/pages/analytics-canvas.js"></script><script src="/js/pages/analytics-payments.js"></script>
</body></html>
