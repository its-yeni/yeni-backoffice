<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>정산 분석 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css">
  <link rel="stylesheet" href="/css/pages/analytics.css">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="content analytics-page">
  <header class="page-header"><div><h3>정산 분석</h3><p>결제 승인금액과 정산금액의 차이, PG 대사 불일치를 집중 확인합니다.</p></div></header>
  <div th:replace="~{analytics/_parts :: meta}"></div>
  <nav th:replace="~{analytics/_parts :: tabs('settlements')}"></nav>
  <div th:replace="~{analytics/_parts :: filter(true)}"></div>

  <div class="an-kpis cols-6" id="an-kpis"></div>

  <div class="an-panel" style="margin-bottom:16px">
    <div class="an-panel-head"><h4>일별 결제 승인금액 vs 정산금액</h4>
      <div class="an-legend"><span><i class="bar"></i>결제 승인금액</span><span><i class="line"></i>정산금액</span></div></div>
    <div class="an-chart" id="an-daily"></div>
  </div>

  <div class="an-grid g-2">
    <div class="an-panel"><h4>매장별 정산 차이금액</h4><div class="an-chart" id="an-store-diff"></div></div>
    <div class="an-panel"><h4>결제수단별 정산금액</h4><div class="an-chart" id="an-method-amount"></div></div>
  </div>

  <div class="an-panel">
    <div class="an-panel-head"><h4>정산 불일치 상세</h4><span id="an-mismatch-summary" style="font-size:12px;color:var(--text-muted)"></span></div>
    <table class="an-table" id="an-detail-table"><thead><tr>
      <th>정산일</th><th>주문번호</th><th>거래번호(TID)</th><th>매장</th><th>결제수단</th>
      <th class="num">결제 승인금액</th><th class="num">정산금액</th><th class="num">차이금액</th><th>정산상태</th><th>불일치</th>
    </tr></thead><tbody></tbody></table>
    <div id="an-detail-pagination" class="an-pagination"></div>
  </div>
</section></main></div>
<script src="/js/common.js"></script><script src="/js/canvas-charts.js"></script><script src="/js/pages/analytics-common.js"></script><script src="/js/pages/analytics-canvas.js"></script><script src="/js/pages/analytics-settlements.js"></script>
</body></html>
