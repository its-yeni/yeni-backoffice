<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>주문 분석 - Yeni Backoffice</title>
  <link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/commerce-admin.css">
  <link rel="stylesheet" href="/css/pages/analytics.css">
</head>
<body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div>
<section class="content analytics-page">
  <header class="page-header"><div><h3>주문 분석</h3><p>일별·채널별·매장별 주문 추이와 상위 상품을 확인합니다.</p></div><div class="page-header-actions"><span th:replace="~{analytics/_parts :: meta}"></span></div></header>
  <nav th:replace="~{analytics/_parts :: tabs('orders')}"></nav>
  <div th:replace="~{analytics/_parts :: filter(false)}"></div>

  <div class="an-kpis cols-4" id="an-kpis"></div>

  <div class="an-panel" style="margin-bottom:16px">
    <div class="an-panel-head"><h4>일별 주문금액 추이</h4>
      <div class="an-legend"><span><i class="bar"></i>주문금액</span><span><i class="line"></i>주문건수</span></div></div>
    <div class="an-chart" id="an-trend"></div>
  </div>

  <div class="an-grid g-2">
    <div class="an-panel"><h4>채널별 주문금액</h4><div class="an-chart" id="an-channel-chart"></div></div>
    <div class="an-panel"><h4>매장별 주문금액 TOP 10</h4><div class="an-chart" id="an-store-chart"></div></div>
  </div>

  <div class="an-panel"><h4>상품별 판매 TOP 10 <span style="font-weight:400;color:var(--text-muted);font-size:11px">— 매출 명세 라인 기준</span></h4>
    <table class="an-table" id="an-product-table"><thead><tr>
      <th>상품</th><th class="num">판매수량</th><th class="num">순매출</th><th class="num">라인수</th>
    </tr></thead><tbody></tbody></table>
  </div>
</section></main></div>
<script src="/js/common.js"></script><script src="/js/canvas-charts.js"></script><script src="/js/pages/analytics-common.js"></script><script src="/js/pages/analytics-canvas.js"></script><script src="/js/pages/analytics-orders.js"></script>
</body></html>
