<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>감사 로그 - Yeni Backoffice</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages/commerce-list-system.css"><link rel="stylesheet" href="/css/pages/audit-logs.css"></head><body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div><section class="product-page commerce-page audit-page">
<header class="page-header"><div><h3>감사 로그</h3><p>결제·정산·재고 운영 작업을 작업자, 대상, 요청 ID와 변경 전후 값으로 추적합니다.</p></div></header>
<div class="audit-summary"><div><span>조회 로그</span><strong id="audit-total">0건</strong></div><div><span>관리자 작업</span><strong id="audit-admin">0건</strong></div><div><span>시스템 자동</span><strong id="audit-system">0건</strong></div><div><span>실패·확인 필요</span><strong id="audit-failed">0건</strong></div></div>
<div class="filter-bar audit-filter"><input id="audit-keyword" type="search" placeholder="대상 키, 요청 ID, 작업 내용 검색"><select id="audit-domain"><option value="">전체 도메인</option><option value="PAYMENT">결제</option><option value="SALES">매출</option><option value="RECOVERY_TASK">복구</option><option value="SETTLEMENT">정산</option><option value="INVENTORY">재고</option></select><select id="audit-actor"><option value="">전체 작업자</option><option value="ADMIN">관리자</option><option value="SYSTEM">시스템 자동</option></select><select id="audit-result"><option value="">전체 결과</option><option value="SUCCESS">성공</option><option value="FAILED">실패</option></select><button class="btn btn-text" id="audit-reset">초기화</button></div>
<div class="data-table-wrap audit-table"><table class="data-table"><thead><tr><th>발생일시</th><th>도메인</th><th>작업</th><th>대상</th><th>변경 (전 → 후)</th><th>작업자</th><th>결과</th><th>요청 ID / 설명</th></tr></thead><tbody id="audit-rows"></tbody></table><div class="data-table-empty" id="audit-empty" hidden><strong>조건에 맞는 감사 로그가 없습니다.</strong><p>필터를 초기화하거나 다른 검색어를 입력해 주세요.</p></div><div id="audit-pagination"></div></div>
</section></main></div><script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/audit-logs.js"></script></body></html>
