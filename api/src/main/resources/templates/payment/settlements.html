<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정산 관리 - Yeni Backoffice</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages/payment-transactions.css"><link rel="stylesheet" href="/css/pages/operations-list-v2.css"><link rel="stylesheet" href="/css/pages/payment-list-system.css"><link rel="stylesheet" href="/css/pages/settlements-v2.css"></head><body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div><section class="content ops-list-page settlement-page">
<header class="page-header"><div><h1>정산 마감</h1><p>확정된 매출을 대사한 뒤 정산을 확정하고 지급합니다.</p></div><div class="page-header-actions"><a class="btn btn-light" href="/admin/payment-operations/settlements/reconciliation">PG 파일 대사</a><button class="btn btn-primary" id="settlement-run">오늘 정산 초안 생성</button></div></header>

<nav class="step-nav" id="settlement-steps" aria-label="정산 마감 단계"></nav>

<div class="settlement-kpis">
  <div class="kpi-card"><div><span>정산 명세</span><small id="settlement-count-sub">조회 기간 기준</small></div><strong id="settlement-count">0건</strong></div>
  <div class="kpi-card"><div><span>승인 매출</span></div><strong id="settlement-sale">0원</strong></div>
  <div class="kpi-card"><div><span>수수료·VAT</span></div><strong id="settlement-fee">0원</strong></div>
  <div class="kpi-card kpi-card-net"><div><span>최종 정산액</span></div><strong id="settlement-net">0원</strong></div>
</div>

<div class="settlement-alert" id="settlement-workflow-alert" hidden></div>
<span id="workflow-ledger" hidden></span><span id="workflow-import" hidden></span><span id="workflow-reconcile" hidden></span><span id="workflow-confirm" hidden></span><span id="workflow-paid" hidden></span>

<div class="settlement-toolbar">
  <input id="settlement-keyword" type="search" placeholder="MID, 정산 ID 검색">
  <div class="settlement-daterange"><input id="settlement-start" type="date"><span>~</span><input id="settlement-end" type="date"></div>
  <select id="settlement-status"><option value="">정산 상태 전체</option><option value="DRAFT">초안</option><option value="CONFIRMED">확정</option><option value="PAID">지급 완료</option></select>
  <button class="btn btn-text" id="settlement-reset">초기화</button>
  <button class="btn btn-primary btn-sm" id="settlement-search">조회</button>
  <details class="settlement-download"><summary class="btn btn-light btn-sm">다운로드 ▾</summary><div><button type="button" id="download-list-csv">현재 목록 CSV</button><button type="button" id="download-store-csv">매장별 요약 CSV</button></div></details>
</div>

<details class="store-settlement-summary" id="store-summary-box"><summary>매장별 정산 요약 <small>정산서(초안·확정·지급)에 잡힌 금액 기준 — 매출 원장 전체가 아닙니다</small></summary><div class="data-table-wrap"><table class="data-table"><thead><tr><th>매장</th><th class="amount">명세</th><th class="amount">정산 대상 매출</th><th class="amount">수수료·VAT</th><th class="amount">최종 정산액</th><th class="amount">지급 완료액</th><th>진행</th></tr></thead><tbody id="store-summary-rows"></tbody></table></div></details>

<div class="data-table-wrap settlement-table-wrap"><table class="data-table settlement-table">
  <thead><tr>
    <th class="checkbox-col"><input type="checkbox" id="settlement-select-all"></th>
    <th class="row-index">#</th>
    <th class="sortable" data-sort="settlementDate">정산일</th>
    <th class="sortable" data-sort="id">정산 ID</th>
    <th class="sortable" data-sort="pgCompany">PG</th>
    <th>MID</th>
    <th class="amount sortable" data-sort="saleAmount">승인 매출</th>
    <th class="amount sortable" data-sort="cancelAmount">취소 금액</th>
    <th class="amount">수수료·VAT</th>
    <th class="amount sortable" data-sort="netAmount">최종 정산액</th>
    <th class="sortable" data-sort="settlementStatus">상태</th>
    <th class="row-menu-col"></th>
  </tr></thead>
  <tbody id="settlement-rows"></tbody>
</table><div class="data-table-empty" id="settlement-empty" hidden><strong>조회된 정산 명세가 없습니다.</strong><p>기간이나 검색 조건을 변경해 주세요.</p></div></div>

<div class="settlement-footer"><span id="settlement-total-label">총 0건</span><div id="settlement-pagination"></div></div>

</section></main></div>
<div class="transaction-drawer-backdrop" id="settlement-backdrop" hidden></div>
<aside class="transaction-drawer settlement-drawer" id="settlement-detail"><header><div><small>정산 명세</small><h2 id="settlement-detail-title">정산 상세</h2></div><button id="settlement-detail-close">×</button></header><div class="transaction-drawer-body" id="settlement-detail-body"></div><footer class="drawer-footer"><button class="btn btn-primary" id="settlement-next" hidden></button></footer></aside>
<script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/settlements.js"></script></body></html>
