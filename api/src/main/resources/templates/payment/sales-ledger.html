<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매출 원장 - Yeni Backoffice</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/layout.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/pages/payment-transactions.css"><link rel="stylesheet" href="/css/pages/operations-list-v2.css"><link rel="stylesheet" href="/css/pages/payment-list-system.css"></head><body><div class="layout"><div th:replace="~{fragments/sidebar}"></div><main class="main"><div th:replace="~{fragments/topbar :: header}"></div><section class="content transaction-page ops-list-page">
<header class="page-header"><div><h3>매출 원장</h3><p>승인과 취소를 별도 거래로 보관하고 정산 반영 상태를 조회합니다.</p></div><a class="btn btn-light" href="/admin/payment-operations">PG 거래</a></header>
<div class="ops-filter-bar"><label class="ops-search"><input id="ledger-keyword" type="search" placeholder="주문번호, TID, 결제 ID 검색"></label><div class="ops-date-range"><input id="ledger-start" type="date"><span>~</span><input id="ledger-end" type="date"></div><select id="ledger-type"><option value="">전체 거래</option><option value="SALE">승인</option><option value="CANCEL">취소</option></select><select id="ledger-confirmed"><option value="">전체 확정 상태</option><option value="false">구매 확정 대기</option><option value="true">구매 확정</option></select><select id="ledger-settlement"><option value="">전체 정산 상태</option><option value="NOT_SETTLED">정산 대기</option><option value="CALCULATED">계산 완료</option><option value="SETTLED">정산 확정</option><option value="PAID">지급 완료</option><option value="CARRIED_OVER">다음 정산 차감</option></select><button class="btn btn-primary btn-sm" id="ledger-search">조회</button><button class="btn btn-text" id="ledger-reset">초기화</button></div>
<div class="ops-summary-strip"><div><div class="k-txt"><span>승인 매출</span><strong id="ledger-sale">0원</strong></div><i class="k-ico is-ok">✓</i></div><div><div class="k-txt"><span>취소</span><strong id="ledger-cancel">0원</strong></div><i class="k-ico is-danger">✕</i></div><div><div class="k-txt"><span>순매출</span><strong id="ledger-net">0원</strong></div><i class="k-ico">₩</i></div><div><div class="k-txt"><span>구매 확정 대기</span><strong id="ledger-unconfirmed">0건</strong></div><i class="k-ico is-warn">⏱</i></div><div><div class="k-txt"><span>정산 대기</span><strong id="ledger-waiting">0건</strong></div><i class="k-ico is-info">◷</i></div></div>
<div class="ledger-legend" id="ledger-legend"></div>
<div class="data-table-wrap ops-table-wrap"><table class="data-table transaction-table ledger-table"><thead><tr><th class="row-index">#</th><th>거래일시</th><th>주문번호</th><th>구분</th><th>결제 ID</th><th>TID</th><th class="amount">공급가</th><th class="amount">부가세</th><th class="amount">거래금액</th><th>상태</th></tr></thead><tbody id="ledger-rows"></tbody></table><div class="data-table-empty" id="ledger-empty" hidden><strong>조회된 원장 거래가 없습니다.</strong><p>기간이나 검색 조건을 변경해 주세요.</p></div><div id="ledger-pagination"></div></div>
</section></main></div><div class="transaction-drawer-backdrop" id="ledger-backdrop" hidden></div><aside class="transaction-drawer" id="ledger-detail"><header><div><small>불변 매출 거래</small><h2 id="ledger-detail-title">원장 상세</h2></div><button id="ledger-detail-close">×</button></header><div class="transaction-drawer-body" id="ledger-detail-body"></div></aside><script src="/js/admin-pagination.js"></script><script src="/js/common.js"></script><script src="/js/pages/sales-ledger.js"></script></body></html>
