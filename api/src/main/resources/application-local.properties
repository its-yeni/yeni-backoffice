# 로컬 개발용 PostgreSQL. `docker compose up -d` 로 띄운다(compose.yaml 참고).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yeni}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:yeni}
spring.datasource.password=${DB_PASSWORD:yeni}
spring.datasource.hikari.data-source-properties.stringtype=unspecified

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false
