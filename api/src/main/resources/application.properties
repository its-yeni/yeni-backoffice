spring.application.name=yeni-backoffice

# test  = 로컬 H2 인메모리(Postgres 없이 빠르게 띄울 때). Flyway 미사용, ddl-auto=create-drop.
# local = 로컬 PostgreSQL(docker compose). Flyway 로 스키마 관리.
# fly / prod = 관리형 PostgreSQL(${DATABASE_URL}). Flyway 로 스키마 관리.
# demo  = 포트폴리오용 데모 데이터 시딩(주문·배송·반품·재고·정산·분개 등).
# 통합 테스트(YeniBackofficeApplicationTests)는 @ActiveProfiles("test")로 demo를 제외한다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:test,demo}

# Flyway: PostgreSQL 프로파일에서만 켠다(test 는 아래에서 끔). 스키마 원천은 db/migration/V*.sql.
spring.flyway.baseline-on-migrate=false

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.resources.chain.cache=false

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
commerce.product-image-dir=${PRODUCT_IMAGE_DIR:./data/uploads/products}

portfolio.inicis.mid=${INICIS_MID:INIpayTest}
portfolio.inicis.sign-key=${INICIS_SIGN_KEY:portfolio-local-sign-key}
portfolio.inicis.return-url=${INICIS_RETURN_URL:http://localhost:8080/api/payments/inicis/stdpay/return}
portfolio.inicis.close-url=${INICIS_CLOSE_URL:http://localhost:8080/payments/close}

# 실패 로그 AI 원인 요약. provider=mock이면 OPENAI_API_KEY 없이도 항상 동작합니다.
portfolio.insight.provider=${INSIGHT_PROVIDER:mock}
portfolio.insight.window-hours=${INSIGHT_WINDOW_HOURS:24}
portfolio.insight.max-entries=${INSIGHT_MAX_ENTRIES:50}
portfolio.insight.cache-ttl-seconds=${INSIGHT_CACHE_TTL_SECONDS:300}
portfolio.insight.openai.api-key=${OPENAI_API_KEY:}
portfolio.insight.openai.model=${OPENAI_INSIGHT_MODEL:gpt-5-mini}
portfolio.insight.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
portfolio.insight.openai.timeout-ms=${OPENAI_TIMEOUT_MS:8000}

# 운영 자동화 스케줄러
portfolio.settlement.auto-confirm-enabled=${SETTLEMENT_AUTO_CONFIRM:true}
portfolio.settlement.auto-confirm-grace-days=${SETTLEMENT_AUTO_CONFIRM_GRACE_DAYS:7}
portfolio.settlement.auto-confirm-cron=${SETTLEMENT_AUTO_CONFIRM_CRON:0 10 1 * * *}
portfolio.settlement.auto-draft-enabled=${SETTLEMENT_AUTO_DRAFT:true}
portfolio.settlement.auto-draft-cron=${SETTLEMENT_AUTO_DRAFT_CRON:0 10 2 * * *}
# 회계 분개 자동 전기 (매출 원장·정산 명세 -> 복식부기 분개)
portfolio.gl.auto-post-enabled=${GL_AUTO_POST:true}
portfolio.gl.auto-post-cron=${GL_AUTO_POST_CRON:0 40 2 * * *}
